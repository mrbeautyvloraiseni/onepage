name: Cleanup old Actions runs

on:
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs older than 5 days, keep newest per workflow
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - (5 * 24 * 60 * 60 * 1000);
            const currentRunId = Number(context.runId);
            const MAX_DELETIONS = 50;

            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const runs = response.data.workflow_runs;

            const newestRunByWorkflow = new Map();
            for (const run of runs) {
              if (!newestRunByWorkflow.has(run.workflow_id)) {
                newestRunByWorkflow.set(run.workflow_id, run);
              }
            }

            const protectedRunIds = new Set(
              [...newestRunByWorkflow.values()].map(run => run.id)
            );
            protectedRunIds.add(currentRunId);

            let deleted = 0;
            for (const run of runs) {
              if (deleted >= MAX_DELETIONS) break;
              if (protectedRunIds.has(run.id)) continue;
              if (run.status !== "completed") continue;
              if (new Date(run.created_at).getTime() >= cutoff) continue;

              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });

              deleted += 1;
            }

            core.info(
              `Deleted ${deleted} old completed workflow run(s). Kept the newest run of each workflow.`
            );
