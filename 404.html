<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>404 – Seite nicht gefunden | MR Beauty</title>
  <style>
    @font-face{font-family:Montserrat;src:url('/fonts/Montserrat-Regular.otf')}@font-face{font-family:Montserrat;src:url('/fonts/Montserrat-Bold.otf');font-weight:700}
    :root{--neon:#C8CF04}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Montserrat,Arial,sans-serif}
    main{min-height:100dvh;display:grid;place-items:center;padding:28px 24px;text-align:center}.card{width:min(100%,520px)}
    img{display:block;width:min(62vw,248px);height:auto;margin:0 auto 38px}.code{margin:0;color:var(--neon);font-size:clamp(56px,12vw,82px);font-weight:700;line-height:1}.title{margin:18px 0 0;font-size:clamp(27px,6vw,35px);line-height:1.16}.text{margin:16px auto 0;max-width:380px;color:#c4c4ca;font-size:17px;line-height:1.55}.button{display:inline-flex;align-items:center;justify-content:center;min-width:220px;height:54px;margin-top:34px;padding:0 26px;border-radius:16px;background:var(--neon);color:#000;text-decoration:none;font-weight:700;font-size:17px}
  </style>
</head>
<body>
  <main><section class="card">
    <img src="/images/logo.png" alt="MR Beauty Vlora Iseni">
    <p class="code">404</p>
    <h1 class="title">Seite nicht gefunden</h1>
    <p class="text">Die gewünschte Seite ist nicht vorhanden.</p>
    <a class="button" href="/">Zur Startseite</a>
  </section></main>
  <script>
    const parts=location.pathname.split('/').filter(Boolean);
    const token=parts.length===2&&parts[0]==='q'&&/^\d{16}$/.test(parts[1])?parts[1]:'';
    if(token){
      try{sessionStorage.setItem('mrBeautyReceiptToken',token);}catch(e){}
      location.replace('/q/?r='+encodeURIComponent(token));
    }
  </script>
</body>
</html>
